<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/layout"
	layout:decorate="layout/layout">

<div layout:fragment="content">
	<div class="container-fluid">

		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h1 class="h2">
				<i class="ti ti-speakerphone me-2"></i>Campagnes Marketing
			</h1>
			<a th:href="@{/campagnes/ajouter}" class="btn btn-primary">
				<i class="ti ti-plus me-1"></i>Nouvelle Campagne
			</a>
		</div>

		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}">
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" th:text="${erreur}">
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<!-- Liste des Campagnes -->
		<div class="card shadow">
			<div class="card-header">
				<h6 class="mb-0">Campagnes</h6>
			</div>
			<div class="card-body">
				<div class="row">
					<div class="col-md-6 mb-4" th:each="campagne : ${campagnes}">
						<div class="card h-100">
							<div class="card-header d-flex justify-content-between align-items-center">
								<h6 class="mb-0" th:text="${campagne.nomCampagne}"></h6>
								<span th:classappend="'badge bg-' +
									${campagne.statut.name() == 'EN_COURS' ? 'success' :
									  campagne.statut.name() == 'PLANIFIEE' ? 'warning' :
									  campagne.statut.name() == 'TERMINEE' ? 'secondary' : 'danger'}"
									th:text="${campagne.statut}"></span>
							</div>
							<div class="card-body">
								<div class="mb-2">
									<small class="text-muted">Type: </small><small th:text="${campagne.type}"></small>
								</div>
								<div class="mb-2" th:if="${campagne.dateDebut}">
									<small class="text-muted">Début: </small>
									<small th:text="${#temporals.format(campagne.dateDebut, 'dd/MM/yyyy')}"></small>
									<small th:if="${campagne.dateFin}"> → </small>
									<small th:if="${campagne.dateFin}" th:text="${#temporals.format(campagne.dateFin, 'dd/MM/yyyy')}"></small>
								</div>
								<div class="mb-2" th:if="${campagne.budget}">
									<small class="text-muted">Budget: </small>
									<small th:text="${#numbers.formatDecimal(campagne.budget, 0, 'COMMA', 0, 'POINT')} + ' FCFA'"></small>
								</div>
								<div class="mb-2" th:if="${campagne.utilisateurResponsable}">
									<small class="text-muted">Responsable: </small>
									<small th:text="${campagne.utilisateurResponsable.prenom + ' ' + campagne.utilisateurResponsable.nom}"></small>
								</div>
								<div class="row text-center mt-3">
									<div class="col">
										<small>Envois</small>
										<div class="fw-bold text-primary" th:text="${campagne.nombreTotalEnvois}">0</div>
									</div>
									<div class="col">
										<small>Contacts</small>
										<div class="fw-bold text-info" th:text="${campagne.nombreContactsTotal}">0</div>
									</div>
									<div class="col">
										<small>Conversion</small>
										<div class="fw-bold text-success" th:text="(${campagne.tauxConversion} ?: 0) + '%'">0%</div>
									</div>
								</div>
							</div>
							<div class="card-footer bg-transparent">
								<div class="btn-group w-100">
									<a th:href="@{/campagnes/modifier/{id}(id=${campagne.id})}" class="btn btn-sm btn-outline-secondary">
										<i class="ti ti-edit me-1"></i>Éditer
									</a>
									<a th:if="${campagne.statut.name() == 'PLANIFIEE'}" th:href="@{/campagnes/executer/{id}(id=${campagne.id})}"
										class="btn btn-sm btn-outline-success"
										onclick="return confirm('Lancer la diffusion de cette campagne ?')">
										<i class="ti ti-send me-1"></i>Exécuter
									</a>
									<a th:href="@{/campagnes/supprimer/{id}(id=${campagne.id})}" class="btn btn-sm btn-outline-danger"
										onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette campagne ?')">
										<i class="ti ti-trash me-1"></i>Supprimer
									</a>
								</div>
							</div>
						</div>
					</div>

					<div class="col-12" th:if="${#lists.isEmpty(campagnes)}">
						<div class="text-center py-5">
							<i class="ti ti-speakerphone text-muted" style="font-size: 3rem;"></i>
							<h5 class="text-muted mt-2">Aucune campagne pour le moment</h5>
							<a th:href="@{/campagnes/ajouter}" class="btn btn-primary mt-2">
								<i class="ti ti-plus me-1"></i>Créer une campagne
							</a>
						</div>
					</div>
				</div>

				<!-- PAGINATION -->
				<div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
					<div class="text-muted">
						Page <span th:text="${currentPage + 1}"></span> sur <span th:text="${totalPages}"></span>
					</div>
					<nav>
						<ul class="pagination mb-0">
							<li class="page-item" th:classappend="${page.first} ? 'disabled'">
								<a class="page-link" th:href="@{/campagnes(page=${currentPage - 1}, size=${page.size})}">Précédent</a>
							</li>
							<li th:each="p : ${#numbers.sequence(0, totalPages - 1)}" class="page-item"
								th:classappend="${p == currentPage} ? 'active'">
								<a class="page-link" th:href="@{/campagnes(page=${p}, size=${page.size})}" th:text="${p + 1}"></a>
							</li>
							<li class="page-item" th:classappend="${page.last} ? 'disabled'">
								<a class="page-link" th:href="@{/campagnes(page=${currentPage + 1}, size=${page.size})}">Suivant</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</div>
</div>
</html>
