<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/layout"
	layout:decorate="layout/layout">

<div layout:fragment="content">
	<div class="card">
		<div class="card-body">
			<h4 class="text-primary mb-4">
				<i class="ti ti-speakerphone me-2"></i>
				<span th:text="${modeEdition} ? 'Modifier la campagne' : 'Nouvelle Campagne'"></span>
			</h4>

			<form th:action="${modeEdition} ? @{/campagnes/modifier/{id}(id=${campagneId})} : @{/campagnes/ajouter}"
				th:object="${campagne}" method="post">

				<div class="row g-3">
					<div class="col-md-8">
						<label class="form-label fw-semibold">Nom de la campagne *</label>
						<input type="text" th:field="*{nomCampagne}" class="form-control" required>
						<div class="text-danger small" th:if="${#fields.hasErrors('nomCampagne')}" th:errors="*{nomCampagne}"></div>
					</div>
					<div class="col-md-4">
						<label class="form-label fw-semibold">Type *</label>
						<select th:field="*{type}" class="form-select" required>
							<option th:each="t : ${types}" th:value="${t.name()}" th:text="${t.name()}"></option>
						</select>
					</div>

					<div class="col-md-3">
						<label class="form-label fw-semibold">Date de début</label>
						<input type="date" th:field="*{dateDebut}" class="form-control">
					</div>
					<div class="col-md-3">
						<label class="form-label fw-semibold">Date de fin</label>
						<input type="date" th:field="*{dateFin}" class="form-control">
					</div>
					<div class="col-md-3">
						<label class="form-label fw-semibold">Budget (FCFA)</label>
						<input type="number" th:field="*{budget}" class="form-control" step="0.01">
					</div>
					<div class="col-md-3">
						<label class="form-label fw-semibold">Statut</label>
						<select th:field="*{statut}" class="form-select">
							<option th:each="s : ${statuts}" th:value="${s.name()}" th:text="${s.name()}"></option>
						</select>
					</div>

					<div class="col-md-6">
						<label class="form-label fw-semibold">Responsable *</label>
						<select th:field="*{utilisateurResponsableId}" class="form-select" required>
							<option value="">Sélectionner...</option>
							<option th:each="u : ${utilisateurs}" th:value="${u.id}"
								th:text="${u.prenom + ' ' + u.nom}"></option>
						</select>
						<div class="text-danger small" th:if="${#fields.hasErrors('utilisateurResponsableId')}" th:errors="*{utilisateurResponsableId}"></div>
					</div>
					<div class="col-md-6">
						<label class="form-label fw-semibold">Taux de conversion cible (%)</label>
						<input type="number" th:field="*{tauxConversion}" class="form-control" step="0.01">
					</div>

					<div class="col-12">
						<label class="form-label fw-semibold">Objectif</label>
						<textarea th:field="*{objectif}" class="form-control" rows="3"></textarea>
					</div>
				</div>

				<div class="mt-4 pt-3 border-top d-flex justify-content-between">
					<a th:href="@{/campagnes}" class="btn btn-outline-secondary">
						<i class="ti ti-arrow-left me-2"></i>Annuler
					</a>
					<button type="submit" class="btn btn-primary">
						<i class="ti ti-check me-2"></i>
						<span th:text="${modeEdition} ? 'Enregistrer les modifications' : 'Créer la campagne'"></span>
					</button>
				</div>
			</form>
		</div>
	</div>
</div>
</html>
