<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/layout"
	layout:decorate="layout/layout">

<head>
	<title>Gestion des opportunités</title>
</head>
<div layout:fragment="content">
	<div class="container-fluid">

		<!-- EN-TETE -->
		<div class="d-flex justify-content-between align-items-center mb-4">
			<div>
				<h4 class="text-primary mb-1">
					<i class="ti ti-bullseye me-2"></i>Opportunités
				</h4>
				<p class="text-muted mb-0">Suivez votre pipeline commercial</p>
			</div>
		</div>

		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" th:text="${success}">
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>
		<div th:if="${erreur}" class="alert alert-danger alert-dismissible fade show" th:text="${erreur}">
			<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
		</div>

		<div class="card">
			<div class="card-body">
				<div class="table-responsive">
					<table class="table table-striped table-hover align-middle">
						<thead>
							<tr>
								<th>Opportunité</th>
								<th>Client</th>
								<th>Étape</th>
								<th>Montant estimé</th>
								<th>Probabilité</th>
								<th>Clôture prévue</th>
								<th>Statut</th>
								<th class="text-end">Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="opportunite : ${opportunites}">
								<td>
									<div class="fw-bold" th:text="${opportunite.nomOpportunite}"></div>
									<small class="text-muted" th:text="${opportunite.description}"></small>
								</td>
								<td>
									<a th:if="${opportunite.idClient}" th:href="@{/clients/{id}(id=${opportunite.idClient})}"
										th:text="${opportunite.nomClient}"></a>
									<span th:unless="${opportunite.idClient}" class="text-muted">-</span>
								</td>
								<td><span class="badge bg-info" th:text="${opportunite.etapeVente}"></span></td>
								<td th:text="${#numbers.formatDecimal(opportunite.montantEstime, 0, 'COMMA', 0, 'POINT')} + ' FCFA'"></td>
								<td>
									<div class="d-flex align-items-center">
										<div class="progress flex-grow-1 me-2" style="height: 6px; width: 80px;">
											<div class="progress-bar bg-primary" th:style="'width: ' + ${opportunite.probabilite} + '%;'"></div>
										</div>
										<small th:text="${opportunite.probabilite} + '%'"></small>
									</div>
								</td>
								<td><small th:text="${opportunite.dateCloturePrevue != null} ? ${#temporals.format(opportunite.dateCloturePrevue, 'dd/MM/yyyy')} : '-'"></small></td>
								<td>
									<span th:classappend="'badge bg-' +
										${opportunite.statut == 'GAGNEE' ? 'success' :
										  opportunite.statut == 'PERDUE' ? 'danger' : 'warning'}"
										th:text="${opportunite.statut}"></span>
								</td>
								<td>
									<div class="d-flex justify-content-end gap-1">
										<a th:href="@{/opportunitees/modifier/{id}(id=${opportunite.id})}"
											class="btn btn-sm btn-outline-secondary" title="Modifier">
											<i class="ti ti-edit"></i>
										</a>
										<a th:href="@{/opportunitees/supprimer/{id}(id=${opportunite.id})}"
											class="btn btn-sm btn-outline-danger" title="Supprimer"
											onclick="return confirm('Êtes-vous sûr de vouloir supprimer cette opportunité ?')">
											<i class="ti ti-trash"></i>
										</a>
									</div>
								</td>
							</tr>

							<tr th:if="${#lists.isEmpty(opportunites)}">
								<td colspan="8" class="text-center py-4">
									<i class="ti ti-bullseye text-muted" style="font-size: 3rem;"></i>
									<h5 class="text-muted mt-2">Aucune opportunité trouvée</h5>
									<p class="text-muted">Les opportunités se créent depuis la fiche d'un client</p>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<!-- PAGINATION -->
				<div th:if="${totalPages > 1}" class="d-flex justify-content-between align-items-center mt-4">
					<div class="text-muted">
						Page <span th:text="${currentPage + 1}"></span> sur <span th:text="${totalPages}"></span>
						(<span th:text="${page.totalElements}"></span> opportunités)
					</div>
					<nav>
						<ul class="pagination mb-0">
							<li class="page-item" th:classappend="${page.first} ? 'disabled'">
								<a class="page-link" th:href="@{/opportunitees(page=${currentPage - 1}, size=${page.size})}">Précédent</a>
							</li>
							<li th:each="p : ${#numbers.sequence(0, totalPages - 1)}" class="page-item"
								th:classappend="${p == currentPage} ? 'active'">
								<a class="page-link" th:href="@{/opportunitees(page=${p}, size=${page.size})}" th:text="${p + 1}"></a>
							</li>
							<li class="page-item" th:classappend="${page.last} ? 'disabled'">
								<a class="page-link" th:href="@{/opportunitees(page=${currentPage + 1}, size=${page.size})}">Suivant</a>
							</li>
						</ul>
					</nav>
				</div>
			</div>
		</div>
	</div>
</div>
</html>
